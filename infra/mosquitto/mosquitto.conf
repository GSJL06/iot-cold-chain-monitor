# Mosquitto 2.0.x — configuración de ColdChain Monitor (v1, entorno local)
# Contrato: docs/mqtt-contract.md. Amenazas cubiertas: docs/threat-model.md (1, 7).

listener 1883
protocol mqtt

# Sin acceso anónimo: cada cliente tiene usuario y contraseña (archivo generado, no versionado).
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Límites contra abuso (amenaza 7): payloads de telemetría pesan menos de 1 KB.
message_size_limit 4096
max_connections 100

# Persistencia: sesiones y mensajes retenidos (status) sobreviven a un reinicio.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# $SYS cada 10 s (lo usa el healthcheck de Docker).
sys_interval 10

# Registro en stdout para que lo recoja Docker.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
